<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignments</title>
    <link rel="icon" type="png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
        <a href="portal.html">
        <img src="logo.jpeg" alt="Logo" class="logo">
        </a>
</header>

<div class="page-container centered">
    <div class="page-content">
        <h2 class="page-title">Assignments</h2>

        <table class="table">
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Title</th>
                    <th>Due Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Math</td>
                    <td>Algebra Worksheet</td>
                    <td>03/11/2025</td>
                    <td>Pending</td>
                </tr>
                <tr>
                    <td>English</td>
                    <td>Essay on Technology</td>
                    <td>04/11/2025</td>
                    <td>Completed</td>
                </tr>
            </tbody>
        </table>

        <div class="form-section centered-form">
            <label for="submit-file">Upload Assignment:</label>
            <input type="file" id="submit-file"><br>
            
                <label>Submit Type:</label>
                <div class="checkbox-row">
                    <label><input type="checkbox" name="submit-type" value="online"> Online</label>
                    <label><input type="checkbox" name="submit-type" value="offline"> Offline</label>
                </div>

            <br><button>Submit Assignment</button>
        </div>

        <a href="portal.html" class="back-btn">Back to Portal</a>
    </div>
</div>

<footer>
    &copy; 2025 ICBT Portal. All rights reserved
</footer>

</body>
</html>
