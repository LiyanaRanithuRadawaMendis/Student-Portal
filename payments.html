<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Payments</title>
    <link rel="icon" type="png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script
  src='https://cdn.jotfor.ms/agent/embedjs/019a4288a25676358f909b22c396099d4a7f/embed.js?skipWelcome=1&maximizable=1'>
</script>
<header>
        <a href="portal.html">
        <img src="logo.jpeg" alt="Logo" class="logo">
        </a>
</header>

<div class="page-container centered">
    <div class="page-content">
        <h2 class="page-title">Student Payments</h2>

        <table class="table">
            <thead>
                <tr>
                    <th>Invoice ID</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>INV001</td>
                    <td>01/10/2025</td>
                    <td>LKR.50000.00</td>
                    <td>Paid</td>
                </tr>
                <tr>
                    <td>INV002</td>
                    <td>15/10/2025</td>
                    <td>LKR.28050.00</td>
                    <td>Pending</td>
                </tr>
            </tbody>
        </table>

        <div class="form-section">
            <label for="amount">Pay Amount:</label>
            <input type="number" id="amount" placeholder="Enter amount">

            <label>Payment Method:</label>
            <input type="radio" name="method" value="card"> Card
            <input type="radio" name="method" value="paypal"> PayPal
            <input type="radio" name="method" value="bank"> Bank Transfer

            <button>Submit Payment</button>
        </div>

        <a href="portal.html" class="back-btn">Back to Portal</a>
    </div>
</div>

<footer>
    &copy; 2025 ICBT Portal. All rights reserved
</footer>

</body>
</html>
