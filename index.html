<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Change The Scales According To Device -->
  <title>ICBT Portal - Login</title> 
  <link rel="icon" type="png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <header>
    <img src="logo.jpeg" alt="ICBT Logo" class="logo">

    <h1>ICBT Student Portal</h1>
    <p>Your gateway to learning and resources</p>
  </header>

  <main class="login-container">
    <form action="portal.html" method="get" class="login-form">
      <h2>Login</h2>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit">Login</button>
    </form>
  </main>

  <footer>
    <p>© 2025 ICBT Portal. All rights reserved.</p>
  </footer>
<script
  src='https://cdn.jotfor.ms/agent/embedjs/019a4288a25676358f909b22c396099d4a7f/embed.js?skipWelcome=1&maximizable=1'>
</script>
</body>
</html>
